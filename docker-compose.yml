services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 默认从源码在容器内构建（宿主不需要 Go/Node）：
    #   docker compose up -d --build
    # 想用预编译路线（快）：先 bash scripts/package_linux.sh 产出 dist/amd64/artex，
    # 再把下面的 dockerfile 改成 Dockerfile。
    build:
      context: .
      dockerfile: ${ARTEX_DOCKERFILE:-Dockerfile.build}
    image: ${ARTEX_IMAGE:-artex-fork}:${ARTEX_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      ARTEX_CRED_KEY: ${ARTEX_CRED_KEY:-}
    ports:
      - "${ARTEX_PORT:-8787}:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 PostgreSQL 之外的本地数据、jwt.key 链接目标等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

  # ==========================================================================
  # 以下为「资产测绘」可选组件（ScopeSentry）。默认不启动。
  #   加装：bash deploy/enable-asm.sh        （等价于 --profile asm up -d）
  #   卸载：bash deploy/disable-asm.sh
  # 上游：https://github.com/Autumn-27/ScopeSentry （Web/API/MCP）
  #       https://github.com/Autumn-27/ScopeSentry-Scan （扫描节点）
  # 两个仓库发版节奏不同，所以 ASM_TAG / ASM_SCAN_TAG 分开锁；
  # 不要把扫描节点的 tag 跟 Web 写死成同一个（扫描端通常落后几个版本）。
  # 两个 tag 都必须是固定版本，不用 latest（上游重推 tag 仍可能变）；
  # 要完全可复现请用 image@sha256:<digest>，digest 获取：
  #   docker buildx imagetools inspect autumn27/scopesentry:1.9.4
  #   docker buildx imagetools inspect autumn27/scopesentry-scan:1.9.1
  # 它们与本体的关系只有一条：ARTEX 通过 http://scope-sentry:8082/mcp 读资产。
  # ==========================================================================
  asm-mongo:
    image: mongo:7.0.28
    profiles: ["asm"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${ASM_MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${ASM_MONGO_PASSWORD:-asm-not-configured}
    ports:
      - "127.0.0.1:27017:27017" # asm-scan 走 host 网络，必须能从 127.0.0.1 连
    volumes:
      - ./data/asm/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  asm-redis:
    image: redis:7.0.11
    profiles: ["asm"]
    command: redis-server --requirepass ${ASM_REDIS_PASSWORD:-asm-not-configured}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/asm/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${ASM_REDIS_PASSWORD:-asm-not-configured} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  scope-sentry:
    image: autumn27/scopesentry:${ASM_TAG:-1.9.4}
    profiles: ["asm"]
    environment:
      TIMEZONE: Asia/Shanghai
      MONGODB_IP: asm-mongo
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${ASM_MONGO_USER:-root}
      MONGODB_PASSWORD: ${ASM_MONGO_PASSWORD:-asm-not-configured}
      REDIS_IP: asm-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${ASM_REDIS_PASSWORD:-asm-not-configured}
    ports:
      - "${ASM_BIND:-127.0.0.1}:${ASM_PORT:-8082}:8082"
    volumes:
      - ./data/asm/files:/opt/ScopeSentry/files
      - ./data/asm/images:/opt/ScopeSentry/images
      - ./data/asm/uploads:/opt/ScopeSentry/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    depends_on:
      asm-mongo:
        condition: service_healthy
      asm-redis:
        condition: service_healthy
    restart: unless-stopped

  # 扫描节点必须 host 网络（上游要求），因此它在 Linux 宿主上跑；
  # Docker Desktop（Windows/macOS）不支持 host 网络 → 见 deploy/start.ps1 的提示。
  asm-scan:
    # 1.9.1 = 与 Web v1.9.4 同代的扫描节点固定 tag（未核实镜像存在；
    # 若该 tag 不存在，用 ASM_SCAN_TAG 覆盖成已发布的版本，勿回退到 latest）。
    image: autumn27/scopesentry-scan:${ASM_SCAN_TAG:-1.9.1}
    profiles: ["asm"]
    network_mode: host
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      NodeName: ${ASM_NODE_NAME:-lab-node}
      TimeZoneName: Asia/Shanghai
      MONGODB_IP: 127.0.0.1
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${ASM_MONGO_USER:-root}
      MONGODB_PASSWORD: ${ASM_MONGO_PASSWORD:-asm-not-configured}
      REDIS_IP: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${ASM_REDIS_PASSWORD:-asm-not-configured}
    depends_on:
      asm-redis:
        condition: service_healthy
      scope-sentry:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
